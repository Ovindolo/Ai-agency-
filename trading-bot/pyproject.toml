[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "ccxt>=4.3",
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
