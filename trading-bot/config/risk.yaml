# Hard risk limits. Code only. Jev never reads or changes these.
max_position_pct: 0.20          # max 20% of equity in one position
max_open_positions: 2
cash_reserve_pct: 0.30          # 30% never deployed
risk_per_trade_pct: 0.01        # 1% of equity lost if stop is hit
risk_per_trade_min_pct: 0.005   # /set clamp lower bound
risk_per_trade_max_pct: 0.015   # /set clamp upper bound
max_daily_loss_pct: 0.03        # -> pause 24h
max_weekly_loss_pct: 0.08       # -> kill
max_drawdown_pct: 0.12          # from equity peak -> kill
profit_lock_trigger_pct: 0.10   # once realized profit >= 10% of starting equity...
profit_lock_fraction: 0.50      # ...lock half of it as reserve
stop_min_pct: 0.015             # stops tighter than this are widened to it
stop_max_pct: 0.025             # stops wider than this -> skip (too volatile)
min_reward_risk: 1.8
trailing_after_r: 1.2
time_stop_minutes: 2880         # 48h
min_edge_fee_mult: 2.5          # target move must be >= 2.5x round-trip cost
taker_fee_pct: 0.001            # Binance VIP0 taker 0.10% (0.075% paying fees in BNB)
maker_fee_pct: 0.001            # VIP0 maker 0.10%; some pairs run 0% maker promotions: set from `make fees`, never guessed
entry_mode: taker               # taker | maker (post-only limit at the signal close, 1 bar, then cancel)
target_mode: taker              # taker | maker (target rests as a limit sell)
maker_through_bps: 2.0          # resting orders fill only if price trades 2 bps THROUGH them (we are not first in the queue)
slippage_pct: 0.0008            # 8 bps assumed each side
max_spread_bps: 10.0
max_data_age_sec: 120
pause_hours: 24
min_stake_usd: 10.0             # exchange minimum notional
cooldown_bars_after_loss: 8     # 8 x 15m = 2h
stoploss_guard_trades: 3        # 3 stop-outs...
stoploss_guard_lookback_min: 720  # ...within 12h...
stoploss_guard_pause_min: 360   # ...-> no new entries for 6h after the last one (freqtrade StoplossGuard)
correlation_max: 0.70           # 1h-return correlation (7 days) with an open position above this...
correlated_risk_mult: 0.5       # ...-> the new entry is half size (same bet twice otherwise)
kelly_min_trades: 30            # after 30 closed trades...
kelly_negative_mult: 0.5        # ...if Kelly from OUR results is <= 0 (no measured edge) -> half size. Never sizes up.
